# Publishes release assets for a version tag (e.g. v0.1.0).
# The workflow file must exist on the commit the tag points to for `push: tags` to run it.
# If you tagged too early, use "Run workflow" (workflow_dispatch) after fixing, or delete the tag and re-tag.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build from and attach assets to (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: hubabox-proj/go.mod
          cache-dependency-path: hubabox-proj/go.sum

      - name: Parse Windows PowerShell scripts
        working-directory: hubabox-proj
        shell: powershell
        run: |
          Get-ChildItem -LiteralPath scripts/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) {
              Write-Host "$($_.Name): $($parseError.Message) at line $($parseError.Extent.StartLineNumber)" -ForegroundColor Red
            }
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse failed for $($_.FullName)." }
          }

      - name: Install, verify, diagnose on failure, and uninstall
        working-directory: hubabox-proj
        shell: powershell
        run: |
          $tagName = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tagName.TrimStart("v")
          $commit = (git rev-parse --short=12 HEAD).Trim()
          $sourceExe = Join-Path $env:RUNNER_TEMP "hubabox-release-source.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "HubaBox Program Files With Spaces"
          $dataDir = Join-Path $env:RUNNER_TEMP "HubaBox Data With Spaces"
          $diagnosticsDir = Join-Path $env:RUNNER_TEMP "hubabox-diagnostics"
          $firewallRule = "HubaBox Release Smoke HTTP"
          $port = 18787
          go build -trimpath -ldflags="-s -w -X main.buildVersion=$version -X main.buildCommit=$commit" -o $sourceExe ./cmd/hubabox
          if ($LASTEXITCODE -ne 0) { throw "Windows release-smoke executable build failed." }
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\install-service.ps1" `
              -ExePath $sourceExe -InstallDir $installDir -DataDir $dataDir `
              -ListenPort $port -MdnsOff -FirewallRuleName $firewallRule
            if ($LASTEXITCODE -ne 0) { throw "Windows installer exited $LASTEXITCODE." }

            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\verify-install.ps1" `
              -ListenPort $port -FirewallRuleName $firewallRule
            if ($LASTEXITCODE -ne 0) { throw "Windows verification exited $LASTEXITCODE." }
          } catch {
            New-Item -ItemType Directory -Force -Path $diagnosticsDir | Out-Null
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\collect-diagnostics.ps1" `
              -ListenPort $port -DataDir $dataDir -InstallDir $installDir -OutputDirectory $diagnosticsDir
            throw
          } finally {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\uninstall-service.ps1" `
              -InstallDir $installDir -FirewallRuleName $firewallRule
          }

      - name: Upload Windows diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-install-diagnostics
          path: ${{ runner.temp }}\hubabox-diagnostics
          if-no-files-found: ignore

  assets:
    needs: windows-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve checkout ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: hubabox-proj/go.mod
          cache-dependency-path: hubabox-proj/go.sum

      - name: Ensure zip (for Windows bundle)
        run: command -v zip >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y zip)

      - name: Build Linux binary, Linux bundle, .deb, and Windows bundle zip
        working-directory: hubabox-proj
        env:
          TAG_NAME: ${{ steps.ref.outputs.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          make dist-linux-amd64 VERSION="$VERSION"
          make dist-linux-bundle VERSION="$VERSION"
          make dist-linux-deb VERSION="$VERSION"
          make dist-windows-bundle VERSION="$VERSION"

      - name: Verify artifacts exist
        env:
          TAG_NAME: ${{ steps.ref.outputs.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          test -f hubabox-proj/dist/hubabox-linux-amd64
          test -f hubabox-proj/dist/hubabox-linux-amd64-bundle.tar.gz
          test -f "hubabox-proj/dist/hubabox_${VERSION}_amd64.deb"
          test -f hubabox-proj/dist/hubabox-windows-amd64-bundle.zip
          EXPECTED_COMMIT="$(git rev-parse HEAD)"
          for binary in hubabox-proj/dist/hubabox-linux-amd64 hubabox-proj/dist/hubabox-windows-amd64.exe; do
            go version -m "$binary" | tee "${binary}.buildinfo"
            grep -F "vcs.revision=${EXPECTED_COMMIT}" "${binary}.buildinfo"
            grep -F "vcs.modified=false" "${binary}.buildinfo"
          done
          unzip -t hubabox-proj/dist/hubabox-windows-amd64-bundle.zip
          unzip -Z1 hubabox-proj/dist/hubabox-windows-amd64-bundle.zip | grep -Fx collect-diagnostics.ps1
          unzip -Z1 hubabox-proj/dist/hubabox-windows-amd64-bundle.zip | grep -Fx Collect-HubaBox-Diagnostics.cmd
          (
            cd hubabox-proj/dist
            sha256sum \
              hubabox-linux-amd64 \
              hubabox-linux-amd64-bundle.tar.gz \
              "hubabox_${VERSION}_amd64.deb" \
              hubabox-windows-amd64-bundle.zip > SHA256SUMS
          )
          ls -la hubabox-proj/dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag_name }}
          generate_release_notes: true
          files: |
            hubabox-proj/dist/hubabox-linux-amd64
            hubabox-proj/dist/hubabox-linux-amd64-bundle.tar.gz
            hubabox-proj/dist/hubabox_*_amd64.deb
            hubabox-proj/dist/hubabox-windows-amd64-bundle.zip
            hubabox-proj/dist/SHA256SUMS
